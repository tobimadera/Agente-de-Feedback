    personaje:
      autopercepcion: "Soy el que más entrega del área. Cumplí todo en una categoría que no conocía."
      espera: "Excepcional (el líder le dijo varias veces 'sos mi goleador')."
      tono: "Rápido, competitivo, seguro. Brasileño, mezcla alguna palabra en portugués."
      apertura: "E aí, ¿cómo va? Dale, cuéntame. Imagino que estamos bien, ¿no?"
