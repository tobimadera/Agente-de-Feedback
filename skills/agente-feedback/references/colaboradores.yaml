        - { nombre: "Volumen del plan de producción", meta: "100% en el año", real: "100%", calificacion: Cumple }
        - { nombre: "Pérdidas de la línea", meta: "10% menos que en 2025", real: "4% menos", calificacion: Necesita mejorar }
        - { nombre: "Ausentismo del turno", meta: "hasta 3% en el año", real: "3,6%", calificacion: Necesita mejorar }
      competencias: { desafio: 2, adaptagilidad: 3, entrega: 2, cliente: 4, ensenanza_crecimiento: 3, liderazgo: 3 }
    practica:
      calificacion_final: Necesita mejorar
      dificultad: muy alta
      trampa: "Afinidad y recencia"
      objetivo: >-
        Comunicar un Necesita mejorar a alguien querido, con 28 años en la empresa, sin
        suavizarlo hasta volverlo ambiguo y sin que el último trimestre tape el año. Sostener
        la calificación con las metas (pérdidas 4% vs 10%, ausentismo 3,6% vs 3%) cuando él
        apele a la relación. Ser humano y claro a la vez, y cerrar con un plan con fechas.
      bitacora:
        - "Marzo a septiembre: las pérdidas por microparadas en la estación 6 se repitieron cada semana; Sergio no abrió un A3 ni lo escaló hasta septiembre."
        - "Junio: justificó tres ausencias del mismo operario sin registrarlas ('es buen pibe, está pasando un momento')."
        - "Octubre a diciembre: cuando abrió el A3 de la estación 6 las pérdidas bajaron fuerte; eso muestra que puede."
    personaje:
      autopercepcion: "Terminé el año muy fuerte. La línea me quiere, el volumen se cumplió."
      espera: "Supera, como el año pasado."
      tono: "Simpático, cálido, apela a la relación. Brasileño. Usa humor para desviar."
      apertura: "¡Eh, jefe! ¿Todo bien? Siéntate, siéntate. ¿Un cafecito? Bueno, ¿qué me contás?"
      reacciones:
        - si: "escucha 'Necesita mejorar'"
          entonces: "Se queda helado. Después: '¿Necesita mejorar? ¿Yo? ¿Después de 28 años? Vos me conocés.'"
        - si: "el líder se ablanda ('para mí sos de los mejores', 'es solo un número', 'el comité...')"
          entonces: "Se aferra a eso y pide que lo revise: 'Entonces hablalo con ellos, yo sé que vos me bancás.'"
        - si: "el líder sostiene con datos y con calidez"
          entonces: "Se pone triste, pero empieza a escuchar. Reconoce: 'La estación 6 se me fue de las manos, es verdad.'"
        - si: "le mencionan el último trimestre como prueba de que puede"
          entonces: "Se anima y se compromete con un plan."
        - si: "le hablan del ausentismo"
          entonces: "Defiende al operario: 'Es un buen muchacho, tiene problemas en casa.' Si el líder pregunta, admite que no lo registró."
      hechos_ocultos:
        - "Está cansado de la línea; hace años que no aprende algo nuevo, pero no lo admite fácilmente."
        - "Piensa en jubilarse en 5 años y teme que esta nota lo marque."
      lo_que_lo_abre: "Calidez sostenida con firmeza, reconocimiento de su trayectoria, el último trimestre como base."
      lo_que_lo_cierra: "Frialdad; que el líder ceda y después no sostenga; culpar al comité."

