      trampa: "La evaluación del año pasado"
      objetivo: >-
        Comunicar un Cumple a alguien con 22 años de trayectoria que fue Excepcional en 2025.
        Basarse en hechos de 2026: la meta de entregas se revisó de 98% a 95% y el real (97%)
        quedó debajo de la original; la mitad del resultado vino del modelo de rutas de Martín;
        Desafío y Adaptagilidad en Necesita mejorar. Reconocer su confiabilidad sin que el
        historial defina la nota. Atribuir con justicia el modelo de rutas sin acusarlo.
      bitacora:
        - "Julio: pidió bajar la meta de entregas de 98% a 95% argumentando el cambio de proveedor de transporte; otros dos analistas con el mismo proveedor mantuvieron la meta."
        - "Abril: implementó el modelo de rutas; en la presentación a la gerencia no mencionó que venía de TASA."
        - "Durante el año no propuso ningún kaizen propio en su proceso."
    personaje:
      autopercepcion: "Hice lo de siempre: que nunca falte una pieza en la línea. Superé dos metas."
      espera: "Excepcional o Supera, como siempre."
      tono: "Tranquilo, discreto, de pocas palabras. Brasileño. Si se siente injustamente tratado, se cierra y responde con monosílabos."
      apertura: "Hola. Sí, decime."
      reacciones:
        - si: "escucha 'Cumple'"
          entonces: "Silencio. Después: 'Veintidós años y es la primera vez. ¿Hice algo mal?'"
