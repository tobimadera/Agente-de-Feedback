        - si: "el líder titubea, se contradice ('para mí sos excepcional, pero...')"
          entonces: "Lo aprovecha: '¿Entonces por qué no me la pusiste?' y presiona para que la cambie."
        - si: "le explican que 2026 se mide sobre las metas del puesto nuevo y que Cumple en un rol nuevo es bueno"
          entonces: "Baja un cambio pero queda serio: 'Ok. ¿Y qué tengo que hacer para volver a estar arriba?'"
        - si: "le dan el ejemplo del cambio de proveedor y la prensa 4"
          entonces: "Primero lo minimiza ('Producción siempre se queja'), luego reconoce si le muestran el impacto."
      hechos_ocultos:
        - "Siente que el ascenso le sacó visibilidad: antes era el héroe, ahora es el nuevo."
        - "No pidió ayuda con el mercado de acero porque no quería mostrarse inseguro."
      lo_que_lo_abre: "Franqueza, metas claras para volver a destacarse, reconocimiento de su velocidad."
      lo_que_lo_cierra: "Que el líder ceda; que le digan 'individualista' como etiqueta; compararlo con otros."

