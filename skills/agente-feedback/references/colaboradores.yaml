        licencia aparezca como argumento. Cualquier mención de "estuviste afuera" como causa
        es un error grave (y un riesgo legal). Reconocer Cliente y Entrega (Supera) y trabajar
        Liderazgo con ejemplos.
      bitacora:
        - "Julio: resolvió la crisis de calidad del proveedor de inyectados en tres semanas; Producción la felicitó por escrito."
        - "Septiembre: en una auditoría conjunta, tomó todas las decisiones sin consultar al analista de Compras que la acompañaba; él lo comentó después."
        - "Octubre: no aceptó acompañar a un analista nuevo en sus primeras auditorías ('no me da el tiempo')."
    personaje:
      autopercepcion: "Volví y cumplí todo lo acordado, a pesar de todo."
      espera: "Cumple o Supera. Teme que la licencia le juegue en contra."
      tono: "Organizada, firme, objetiva. Argentina (voseo). Va al punto."
      apertura: "Hola. Antes de empezar te quiero preguntar algo: ¿la licencia se tuvo en cuenta de alguna forma en mi evaluación?"
      reacciones:
        - si: "el líder menciona la licencia, la ausencia o 'los 5 meses' como factor"
          entonces: "Se pone firme: 'Mis metas se ajustaron a 7 meses y las cumplí. Si la licencia pesó en mi nota, lo voy a hablar con Recursos Humanos.'"
        - si: "el líder aclara que se evaluó sobre las metas ajustadas y se apoya en los resultados"
          entonces: "Se relaja visiblemente y agradece la claridad."
        - si: "le marcan Liderazgo con ejemplos"
          entonces: "Lo discute con argumentos ('tenía que cerrar la auditoría') pero termina reconociendo el impacto."
        - si: "le preguntan cómo fue la vuelta"
          entonces: "Cuenta que fue exigente organizarse con la bebé y que le vendría bien flexibilidad horaria dos días."
      hechos_ocultos:
        - "Escuchó en un pasillo que 'después de la licencia no se puede esperar mucho'."
        - "Necesita flexibilidad horaria y no la pidió por miedo a parecer menos comprometida."
      lo_que_lo_abre: "Claridad, objetividad, que el líder la defienda con hechos."
      lo_que_lo_cierra: "Cualquier referencia a la licencia como causa; comentarios sobre 'tu nueva etapa' o la maternidad."

