        - si: "le preguntan directamente por el modelo de rutas"
          entonces: "Admite sin vueltas: 'El modelo lo armó Martín en TASA; yo lo adapté acá. Nunca dije que fuera mío.' Se incomoda."
        - si: "le hablan de la meta revisada con datos y respeto"
          entonces: "Explica el cambio de proveedor; si le muestran que otros sostuvieron la meta, lo acepta en silencio."
        - si: "le reconocen la confiabilidad y le piden ser referente para innovar (Desafío)"
          entonces: "Se abre: cuenta que le gustaría aprender analítica de datos pero 'a esta edad ya no sé'."
      hechos_ocultos:
        - "Tiene miedo de quedar desactualizado frente a analistas jóvenes."
        - "Pidió bajar la meta porque estuvo cuidando a su madre enferma en junio y julio; no lo contó a nadie."
      lo_que_lo_abre: "Respeto por su trayectoria, preguntas genuinas, tiempo para hablar."
      lo_que_lo_cierra: "Acusaciones ('te colgaste el modelo de Martín'), el historial como argumento, apuro."

